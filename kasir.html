<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Kasir - Mie Judes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #1a1a1a; color: #fff; padding-bottom: 50px; }
        .main-container { max-width: 500px; margin: auto; padding: 20px; }
        
        /* Card Styling */
        .card-custom { background: #fff; border-radius: 25px; color: #333; overflow: hidden; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-header-custom { background: #d32f2f; padding: 25px; text-align: center; color: #fff; }
        
        /* Logo Circle - Background Hitam agar kontras */
        .logo-container { 
            width: 80px; height: 80px; background: #000; border-radius: 50%; 
            margin: 0 auto 10px; display: flex; align-items: center; justify-content: center;
            border: 3px solid #fff; padding: 5px; overflow: hidden;
        }
        .logo-img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Input Styling */
        .form-control-lg { border-radius: 12px; font-size: 16px; border: 2px solid #eee; }
        .form-control-lg:focus { border-color: #d32f2f; box-shadow: none; }
        
        .btn-input { background: #27ae60; color: #fff; border-radius: 12px; font-weight: 800; padding: 15px; width: 100%; border: none; transition: 0.3s; }
        .btn-input:hover { background: #219150; transform: translateY(-2px); }

        /* Result Section */
        #result { display: none; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .alert-success-custom { background: #f0fff4; border: 2px solid #27ae60; border-radius: 15px; padding: 20px; color: #1a535c; }
        .btn-wa { background: #25d366; color: #fff; border-radius: 12px; font-weight: 700; padding: 12px; width: 100%; display: block; text-decoration: none !important; margin-top: 10px; text-align: center; }

        /* Reminder Styling */
        .reminder-title { color: #f1c40f; font-weight: 800; letter-spacing: 1px; margin-top: 30px; }
        .list-group-item { 
            background: #222; border: 1px solid #333; color: #fff; border-radius: 15px !important; 
            margin-bottom: 10px; transition: 0.3s; padding: 15px;
        }
        .badge-type { background: #d32f2f; color: #fff; font-weight: 700; padding: 5px 10px; border-radius: 8px; font-size: 10px; }
        .btn-sapa { background: #2980b9; color: #fff; border-radius: 8px; font-size: 12px; font-weight: 700; padding: 6px 12px; border: none; }
        
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid #fff; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="main-container">
    <div class="card-custom shadow-lg">
        <div class="card-header-custom">
            <div class="logo-container">
                <img src="https://lh3.googleusercontent.com/d/19THn9yAHSTHluA3t3ybClJWASbG0Blhx" class="logo-img" alt="Logo Mie Judes">
            </div>
            <h4 class="font-weight-bold mb-0">KASIR MIE JUDES</h4>
            <p class="small mb-0 opacity-75">Panel CRM & Point System</p>
        </div>
        
        <div class="p-4">
            <form id="formTransaksi">
                <input type="hidden" name="action" value="updateTransaksi">
                <div class="form-group">
                    <label class="small font-weight-bold text-muted">NOMOR WHATSAPP MEMBER</label>
                    <input type="tel" name="hp" class="form-control form-control-lg" placeholder="08xxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label class="small font-weight-bold text-muted">TOTAL BELANJA (RP)</label>
                    <input type="number" name="nominal" class="form-control form-control-lg" placeholder="Masukkan Nominal" required>
                </div>
                <button type="submit" id="btnSubmit" class="btn-input shadow">
                    <span id="btnText">INPUT TRANSAKSI</span>
                    <div id="spinner" class="spinner"></div>
                </button>
            </form>
        </div>
    </div>

    <div id="result" class="mt-4">
        <div class="alert-success-custom shadow text-center text-dark">
            <h5 class="font-weight-bold">TRANSAKSI BERHASIL! ✅</h5>
            <p id="resDetail" class="mb-1"></p>
            <h3 id="resTotalPoin" class="font-weight-bold text-danger"></h3>
            <hr>
            <a id="btnWA" href="#" target="_blank" class="btn-wa shadow-sm">
                📲 KIRIM POIN KE WHATSAPP
            </a>
            <button onclick="location.reload()" class="btn btn-sm btn-link text-muted mt-2">Input Baru</button>
        </div>
    </div>

    <h6 class="reminder-title text-uppercase mt-5">🔔 Pengingat Hari Ini</h6>
    <div id="reminderList" class="mt-3">
        <div class="text-center py-4" id="loadingRem">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="small mt-2">Mengecek Ultah & Member Lama...</p>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxjxViMtbQSaD30Qt1GHaKS0wxanC92OBFqPGzVhiqws1GyhbwsFXS2LQBcKC1JlTMJ/exec';

    // 1. Ambil Data Reminder Saat Buka Halaman
    window.onload = () => {
        fetch(scriptURL + "?action=getReminders")
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById('reminderList');
            document.getElementById('loadingRem').style.display = 'none';
            
            if(data.length === 0) {
                list.innerHTML = "<p class='text-center text-white-50 small italic'>Tidak ada pengingat hari ini.</p>";
                return;
            }

            data.forEach(item => {
                let linkWA = "https://wa.me/" + item.wa + "?text=" + encodeURIComponent(item.pesan);
                list.innerHTML += `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge-type text-uppercase">${item.tipe}</span>
                            <div class="font-weight-bold mt-1">${item.nama}</div>
                            <div class="small text-white-50">${item.wa}</div>
                        </div>
                        <a href="${linkWA}" target="_blank" class="btn-sapa shadow-sm">SAPA WA</a>
                    </div>
                `;
            });
        });
    };

    // 2. Handle Input Transaksi
    const form = document.getElementById('formTransaksi');
    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('btnText').style.display = 'none';
        document.getElementById('spinner').style.display = 'block';
        document.getElementById('btnSubmit').disabled = true;

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(res => res.json())
        .then(res => {
            if(res.success){
                document.getElementById('result').style.display = 'block';
                document.getElementById('resDetail').innerText = "Member: " + res.nama;
                document.getElementById('resTotalPoin').innerText = res.totalPoin + " POIN";
                document.getElementById('btnWA').href = "https://wa.me/" + res.wa + "?text=" + encodeURIComponent(res.pesan);
                form.reset();
                window.scrollTo({ top: 100, behavior: 'smooth' });
            } else {
                alert("Error: " + res.message);
            }
            document.getElementById('btnText').style.display = 'block';
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('btnSubmit').disabled = false;
        })
        .catch(err => {
            alert("Terjadi kesalahan sistem.");
            location.reload();
        });
    });
</script>

</body>
</html>
