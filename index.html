<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mie Judes - Member & Voucher</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #1a1a1a; color: #fff; }
        .main-container { max-width: 450px; margin: auto; padding: 20px; }
        
        /* Form Styling */
        .card-form { background: #fff; border-radius: 20px; color: #333; overflow: hidden; border: none; }
        .form-header { background: #d32f2f; padding: 30px; text-align: center; color: #fff; }
        .logo-img { width: 80px; border-radius: 50%; border: 3px solid #fff; margin-bottom: 15px; }
        .btn-submit { background: #d32f2f; color: #fff; border-radius: 10px; font-weight: 800; padding: 12px; border: none; width: 100%; transition: 0.3s; }
        .btn-submit:hover { background: #b71c1c; transform: translateY(-2px); }

        /* Modern Voucher Styling */
        #voucherSection { display: none; }
        .voucher-box { 
            background: #fff; border-radius: 20px; color: #333; position: relative;
            padding: 0; overflow: hidden; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .v-top { background: #d32f2f; color: #fff; padding: 20px; text-align: center; }
        .v-body { padding: 30px; text-align: center; position: relative; }
        .v-kode { 
            font-size: 35px; font-weight: 800; color: #d32f2f; border: 3px dashed #d32f2f; 
            padding: 10px; display: inline-block; margin: 15px 0; background: #fff5f5; width: 100%;
        }
        .v-promo { text-align: left; background: #fdf2f2; padding: 15px; border-radius: 10px; font-size: 13px; }
        .v-cut { height: 20px; background: #1a1a1a; width: 40px; border-radius: 20px; position: absolute; bottom: 85px; }
        .cut-left { left: -20px; } .cut-right { right: -20px; }
        
        .btn-download { background: #27ae60; color: #fff; border-radius: 10px; font-weight: 700; padding: 12px; width: 100%; border: none; margin-top: 15px; }
        
        /* Loading Spinner */
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid #fff; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="main-container">
    <div id="formSection" class="card-form shadow-lg">
        <div class="form-header shadow-sm">
            <img src="https://cdn-icons-png.flaticon.com/512/3448/3448099.png" class="logo-img shadow" alt="Logo">
            <h2 class="font-weight-bold mb-0">MIE JUDES</h2>
            <p class="small mb-0">Grand Opening Special Access</p>
        </div>
        <div class="p-4">
            <form id="formDaftar">
                <input type="hidden" name="action" value="register">
                <div class="form-group">
                    <label class="small font-weight-bold">NAMA LENGKAP</label>
                    <input type="text" name="nama" class="form-control" placeholder="Contoh: Ahmad" required>
                </div>
                <div class="form-group">
                    <label class="small font-weight-bold">NOMOR WHATSAPP</label>
                    <input type="tel" name="hp" class="form-control" placeholder="08xxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label class="small font-weight-bold">TANGGAL LAHIR</label>
                    <input type="date" name="tgl_lahir" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="small font-weight-bold">ALAMAT (KECAMATAN)</label>
                    <input type="text" name="alamat" class="form-control" placeholder="Contoh: Maduran" required>
                </div>
                <button type="submit" id="btnSubmit" class="btn-submit mt-2">
                    <span id="btnText">DAFTAR & AMBIL VOUCHER</span>
                    <div id="spinner" class="spinner"></div>
                </button>
            </form>
        </div>
    </div>

    <div id="voucherSection">
        <div id="captureArea" class="voucher-box">
            <div class="v-top">
                <h5 class="font-weight-bold mb-0">EXCLUSIVE VOUCHER</h5>
                <p class="small mb-0">Mie Judes Lamongan</p>
            </div>
            <div class="v-body">
                <p class="mb-1 text-muted">Selamat, <b id="resNama"></b>!</p>
                <div class="v-kode" id="resKode"></div>
                <div class="v-promo shadow-sm">
                    <b>JADWAL PROMO:</b><br>
                    🎁 20 Mei: Gratis Es Teh<br>
                    🎁 21 Mei: Buy 1 Get 1 (Judes/Kentir)<br>
                    🎁 22 Mei: Beli Mie Kuah Free Mie Cerewet<br>
                    🎁 23 Mei: Min 70rb Free Dimsum
                </div>
                <div class="v-cut cut-left"></div>
                <div class="v-cut cut-right"></div>
                <p class="small text-danger font-weight-bold mt-4 mb-0">BERLAKU SAAT GRAND OPENING</p>
            </div>
        </div>
        <button onclick="downloadVoucher()" class="btn-download shadow">📥 SIMPAN KE GALERI</button>
        <p class="text-center mt-3 small text-white-50">Tunjukkan voucher ini ke kasir.</p>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxjxViMtbQSaD30Qt1GHaKS0wxanC92OBFqPGzVhiqws1GyhbwsFXS2LQBcKC1JlTMJ/exec';
    const form = document.getElementById('formDaftar');

    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('btnText').style.display = 'none';
        document.getElementById('spinner').style.display = 'block';
        document.getElementById('btnSubmit').disabled = true;

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(res => res.json())
        .then(res => {
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('voucherSection').style.display = 'block';
            document.getElementById('resNama').innerText = res.nama.toUpperCase();
            document.getElementById('resKode').innerText = res.kode;
            window.scrollTo(0, 0);
        })
        .catch(err => {
            alert('Gagal daftar, coba lagi!');
            document.getElementById('btnText').style.display = 'block';
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('btnSubmit').disabled = false;
        });
    });

    function downloadVoucher() {
        const area = document.getElementById('captureArea');
        html2canvas(area).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Voucher-Mie-Judes.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
